<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff5bf">
  <title>奶门身份鉴定局</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#291f1d}body{background:linear-gradient(145deg,#fff7c9 0%,#fffdf7 55%,#ffe7dc 100%)}main{max-width:560px;margin:auto;padding:22px 18px 48px}.hidden{display:none!important}.badge{display:inline-flex;align-items:center;gap:6px;background:#291f1d;color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:900;transform:rotate(-2deg)}h1{font-size:clamp(42px,11vw,61px);line-height:1.08;letter-spacing:-2px;margin:23px 0 12px}.accent{color:#f2503e;text-shadow:3px 3px 0 #fff}.sub{color:#78635c;line-height:1.75;font-size:16px}.hero{background:#fff;border:3px solid #291f1d;border-radius:30px;padding:15px 12px 17px;margin:24px 0;box-shadow:7px 8px 0 #291f1d}.characters{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-items:end}.characters img{width:100%;height:125px;object-fit:contain;filter:drop-shadow(0 8px 7px rgba(73,49,26,.14));animation:bob 2.1s ease-in-out infinite alternate}.characters img:nth-child(2n){animation-delay:.35s}.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:5px}.chip{background:#ffe04b;border:2px solid #291f1d;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:900}.primary,.secondary,.option,.back{font:inherit;cursor:pointer}.primary{width:100%;border:3px solid #291f1d;background:#ff704f;border-radius:18px;padding:17px 14px;font-size:20px;font-weight:950;box-shadow:5px 6px 0 #291f1d}.primary:active,.option:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #291f1d}.note{color:#8b746c;text-align:center;font-size:12px;line-height:1.7;margin-top:14px}.top{display:flex;justify-content:space-between;align-items:center}.back{background:#fff;border:2px solid #291f1d;border-radius:12px;padding:8px 12px;font-weight:800}.count{font-weight:950}.track{height:13px;background:#fff;border:2px solid #291f1d;border-radius:99px;margin:16px 0 24px;overflow:hidden}.fill{height:100%;background:#ff704f;transition:width .25s}.qcard{background:#fff;border:3px solid #291f1d;border-radius:26px;padding:21px 18px 24px;box-shadow:6px 7px 0 #291f1d}.qemoji{font-size:46px}.qcard h2{font-size:28px;line-height:1.38;margin:12px 0 20px}.option{width:100%;text-align:left;border:2px solid #291f1d;background:#fffdf7;border-radius:15px;padding:15px;margin:8px 0;font-size:16px;font-weight:780;line-height:1.5;box-shadow:3px 4px 0 #291f1d}.option span{color:#ed4f3e;font-weight:950;margin-right:6px}.option.selected{background:#fff0a5;box-shadow:3px 4px 0 #f2503e;border-color:#f2503e}.option.selected:after{content:"已选";float:right;color:#9b392e;font-size:12px;margin-top:2px}.result-card{background:#fff;border:3px solid #291f1d;border-radius:30px;padding:20px 18px 22px;box-shadow:7px 8px 0 #291f1d;text-align:center;overflow:hidden;position:relative}.result-card:before{content:"";position:absolute;width:190px;height:190px;background:#fff0a5;border-radius:50%;top:75px;left:50%;transform:translateX(-50%);z-index:0}.temp{display:inline-block;position:relative;z-index:2;background:#ffdc4f;border:2px solid #291f1d;border-radius:999px;padding:7px 14px;font-weight:900}.result-character{display:block;position:relative;z-index:1;width:100%;height:305px;object-fit:contain;margin:7px auto -4px;filter:drop-shadow(0 13px 10px rgba(78,54,32,.16))}.result-name{font-size:43px;font-weight:950;line-height:1.1}.tagline{color:#765d54;font-size:17px;font-weight:750;margin-top:8px}.desc{background:#fff8dd;border-radius:18px;padding:17px 16px;text-align:left;line-height:1.72;margin:18px 0}.result-hook{font-size:18px;font-weight:900;line-height:1.6;margin:0 0 12px;color:#3e2b26}.result-list{margin:0 0 15px;padding-left:1.35em}.result-list li{margin:7px 0}.result-insight{background:rgba(255,255,255,.7);border-radius:13px;padding:11px 12px;margin:9px 0}.result-insight strong,.result-buddy strong{display:block;color:#a33d2f;margin-bottom:3px}.result-insight p,.result-buddy p{margin:0}.result-buddy{background:#eaf6df;border:2px solid #291f1d;border-radius:14px;padding:12px;margin-top:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{border-radius:15px;padding:11px 6px;background:#f5e8ff}.stat:nth-child(2){background:#eaf6df}.stat small{display:block;color:#795f56;font-weight:700}.stat strong{display:block;font-size:19px;margin-top:5px}.secondary{width:100%;margin-top:14px;border:2px solid #291f1d;background:#fff;border-radius:16px;padding:14px;font-size:16px;font-weight:850}.foot{color:#8a746b;font-size:11px;line-height:1.7;text-align:center;margin-top:19px}@keyframes bob{from{transform:translateY(-3px) rotate(-2deg)}to{transform:translateY(6px) rotate(2deg)}}
  </style>
</head>
<body>
<main>
  <section id="home">
    <span class="badge">🥛 奶门宇宙 · 身份鉴定</span>
    <h1>奶门身份<br><span class="accent">鉴定局！</span></h1>
    <p class="sub">奶门这么大，你到底是哪块奶？<br>30 道抽象小题，查清你的隐藏奶籍。</p>
    <div class="hero">
      <div class="characters">
        <img src="assets/na-wa.png" alt="奶蛙"><img src="assets/nai-dan.png" alt="奶蛋"><img src="assets/xiao-nai-wa.png" alt="小奶蛙"><img src="assets/nai-mao.png" alt="奶猫"><img src="assets/nai-gou.png" alt="奶狗"><img src="assets/nai-tu.png" alt="奶兔">
      </div>
      <div class="chips"><span class="chip">离谱但合理</span><span class="chip">奶味浓度 ↑</span><span class="chip">结果可保存</span></div>
    </div>
    <button class="primary" onclick="start()">速速查明奶籍 →</button>
    <p class="note">约 3–5 分钟 · 无需登录 · 纯娱乐测试</p>
  </section>
  <section id="quiz" class="hidden">
    <div class="top"><button class="back" onclick="previous()">← 返回</button><span id="count" class="count"></span></div>
    <div class="track"><div id="fill" class="fill"></div></div>
    <div class="qcard"><div id="qemoji" class="qemoji"></div><h2 id="question"></h2><div id="options"></div></div>
    <p class="note">选最像你的那一项，没有标准答案。</p>
  </section>
  <section id="result" class="hidden">
    <span class="badge">🔎 奶籍鉴定完毕</span>
    <h1>抓到了！<br><span class="accent">原来你是…</span></h1>
    <div class="result-card">
      <div id="temperature" class="temp"></div><img id="rimage" class="result-character" alt="奶门角色"><div id="rname" class="result-name"></div><div id="tagline" class="tagline"></div><div id="description" class="desc"></div>
      <div class="stats"><div class="stat"><small>抽象浓度</small><strong id="chaos"></strong></div><div class="stat"><small>最佳奶搭子</small><strong id="buddy"></strong></div></div>
    </div>
    <button class="primary" style="margin-top:24px" onclick="saveCard(event)">📸 保存奶门身份卡</button>
    <button class="secondary" onclick="restart()">🔄 不服？重新鉴定</button>
    <p class="foot">结果由趣味匹配算法生成，不代表专业心理测评。<br>角色视觉来自本次提供的奶门角色素材。</p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
