<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff5bf"><title>奶门身份鉴定局</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#291f1d}body{background:linear-gradient(145deg,#fff7c9 0%,#fffdf7 55%,#ffe7dc 100%)}main{max-width:560px;margin:auto;padding:22px 18px 48px}.hidden{display:none!important}.badge{display:inline-flex;align-items:center;gap:6px;background:#291f1d;color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:900;transform:rotate(-2deg)}h1{font-size:clamp(42px,11vw,61px);line-height:1.08;letter-spacing:-2px;margin:23px 0 12px}.accent{color:#f2503e;text-shadow:3px 3px 0 #fff}.sub{color:#78635c;line-height:1.75;font-size:16px}.hero{background:#fff;border:3px solid #291f1d;border-radius:30px;padding:15px 12px 17px;margin:24px 0;box-shadow:7px 8px 0 #291f1d}.characters{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-items:end}.characters img{width:100%;height:125px;object-fit:contain;filter:drop-shadow(0 8px 7px rgba(73,49,26,.14));animation:bob 2.1s ease-in-out infinite alternate}.characters img:nth-child(2n){animation-delay:.35s}.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:5px}.chip{background:#ffe04b;border:2px solid #291f1d;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:900}.primary,.secondary,.option,.back{font:inherit;cursor:pointer}.primary{width:100%;border:3px solid #291f1d;background:#ff704f;border-radius:18px;padding:17px 14px;font-size:20px;font-weight:950;box-shadow:5px 6px 0 #291f1d}.primary:active,.option:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #291f1d}.note{color:#8b746c;text-align:center;font-size:12px;line-height:1.7;margin-top:14px}.top{display:flex;justify-content:space-between;align-items:center}.back{background:#fff;border:2px solid #291f1d;border-radius:12px;padding:8px 12px;font-weight:800}.count{font-weight:950}.track{height:13px;background:#fff;border:2px solid #291f1d;border-radius:99px;margin:16px 0 24px;overflow:hid form:translateY(6px) rotate(2deg)}}
</style></head><body><main>
<section id="home"><span class="badge">🥛 奶门宇宙 · 身份鉴定</span><h1>奶门身份<br><span class="accent">鉴定局！</span></h1><p class="sub">奶门这么大，你到底是哪块奶？<br>30 道抽象小题，查清你的隐藏奶籍。</p><div class="hero"><div class="characters"><img src="assets/na-wa.png"><img src="assets/nai-dan.png"><img src="assets/xiao-nai-wa.png"><img src="assets/nai-mao.png"><img src="assets/nai-gou.png"><img src="assets/nai-tu.png"></div><div class="chips"><span class="chip">离谱但合理</span><span class="chip">奶味浓度 ↑</span><span class="chip">结果可保存</span></div></div><button class="primary" onclick="start()">速速查明奶籍 →</button><p class="note">约 3–5 分钟 · 无需登录 · 纯娱乐测试</p></section>
<section id="quiz" class="hidden"><div class="top"><button class="back" onclick="previous()">← 返回</button><span id="count" class="count"></span></div><div class="track"><div id="fill" class="fill"></div></div><div class="qcard"><div id="qemoji" class="qemoji"></div><h2 id="question"></h2><div id="options"></div></div><p class="note">选最像你的那一项，没有标准答案。</p></section>
<section id="result" class="hidden"><span class="badge">🔎 奶籍鉴定完毕</span><h1>抓到了！<br><span class="accent">原来你是…</span></h1><div class="result-card"><div id="temperature" class="temp"></div><img id="rimage" class="result-character" alt="奶门角色"><div id="rname" class="result-name"></div><div id="tagline" class="tagline"></div><div id="description" class="desc"></div><div class="stats"><div class="stat"><small>抽象浓度</small><strong id="chaos"></strong></div><div class="stat"><small>最佳奶搭子</small><strong id="buddy"></strong></div></div></div><button class="primary" style="margin-top:24px" onclick="saveCard(event)">📸 保存奶门身份卡</button><button class="secondary" onclick="restart()">🔄 不服？重新鉴定</button><p class="foot">结果由趣味匹配算法生成，不代表专业心理测评。<br>角色视觉来自本次提供的奶门角色素材。</p></section>
</main><script>
const roles=[
['奶蛙','assets/na-wa.png','火山','天生的奶门主角','有想法、敢开麦，遇事先冲再说。你不是爱出风头，你只是自带舞台灯。','奶蛋',[5,0,1,4,4]],['奶蛋','assets/nai-dan.png','烫','圆滚滚的治愈核心','你看起来软软的，实际上很有自己的节奏。可爱是天赋，松弛是绝招。','小奶蛙',[1,4,5,0,2]],['小奶蛙','assets/xiao-nai-wa.png','烫','表情包行走体','情绪都写在脸上，快乐很直接。你出现的地方，聊天记录都会变好笑。','奶豆',[3,1,5,4,3]],['奶鼠','assets/nai-shu.png','热','享受生活专业户','能坐着绝不站着，擅长寻找快乐的小角落。你是朋友圈的舒适区。','奶粉',[1,5,4,1,2]],['奶豆','assets/nai-dou.png','热','快乐永动机','脑子里随时有新鲜点子，热闹从不缺席。你不一定最吵，但很会制造惊喜。','奶狗',[4,1,4,4,5]],['奶狗','assets/nai-gou.png','热','友谊发射器','热情是你的默认设置。别人还在犹豫，你已经开始拉群组织活动了。','奶豆',[4,2,3,2,5]],['奶粉','assets/nai-fen.png','温','温柔又有小脾气','你重视感受，也会认真照顾自己。看似慢热，熟悉后有独特的幽默感。','奶鼠',[2,4,4,2,3]],['奶鸡','assets/nai-ji.png','温','低调的奶量担当','你不爱争抢镜头，但关键时刻总能站出来。可靠之余，还有一点奇怪的幽默。','奶兔',[2,4,3,3,3]],['奶猫','assets/nai-mao.png','温','安静观察大师','不一定先说话，但什么都看在眼里。你的边界感和反差萌一样突出。','奶鱼',[0,5,3,2,1]],['奶屎','assets/nai-shi.png','冷','抽象界隐藏王者','别人还在讲逻辑，你已经把气氛带到另一个次元。你的梗需要一点理解门槛。','奶茶',[2,3,1,5,2]],['豆奶','assets/dou-nai.png','冷','冷热交替神秘奶','能安静也能突然发疯。你很难被一种标签概括，反差就是你的名片。','奶猫',[2,4,3,4,2]],['奶兔','assets/nai-tu.png','冷','柔软的独处选手','你喜欢有自己的小世界。看似淡定，其实心里藏着一座热闹游乐园。','奶鸡',[1,5,5,1,2]],['奶鱼','assets/nai-yu.png','冷','随波不逐流','你有自己的生活频率。别人觉得你冷，你只是把能量留给真正喜欢的事。','奶猫',[0,5,2,3,1]],['奶茶','assets/nai-cha.png','冷','淡定的吐槽艺术家','外表岁月静好，内心弹幕不停。你总能用一句话精准点破全场。','奶屎',[2,4,2,5,2]],['奶瓶','assets/nai-ping.png','冷','自带保护罩的奶','你不爱无谓争执，擅长守护自己的节奏。熟悉你的人才知道你多有趣。','奶蛋',[1,5,4,1,1]],['西格玛奶蛙','assets/sigma-nai-wa.png','冷','独行奶门传说','你对自己的路线很坚定，不急着被理解。越是热闹，越能保持自己的主意。','奶蛙',[1,5,1,4,0]]];
const questions=[['🎉','朋友突然喊你出门，你会？',['鞋穿好了，人呢？','先问都有谁','有吃的我就去','发个表情包装没看见']],['🧃','一杯奶茶洒了，你第一反应？',['现场指挥抢救','默默收拾','心疼奶茶三秒','拍照发群：案发现场']],['🛌','周末最理想的打开方式？',['出去寻找新鲜事','睡到自然醒','窝着看可爱视频','随机开启神秘计划']],['📱','你的聊天风格最接近？',['语音轰炸机','已读但认真想回复','贴贴表情包','怪图批发商']],['🧑‍🤝‍🧑','朋友心情不好，你会？',['带TA出去散心','静静陪着','送点小零食','先讲一个离谱笑话']],['🍜','大家纠结吃什么时？',['我来拍板！','都可以真的','选看起来可爱的店','转盘决定命运']],['🫣','被人夸可爱时，你会？',['那当然！','害羞转移话题','嘿嘿谢谢','当场做个鬼脸']],['🚀','一个新活动出现，你通常？',['第一个报名','先看攻略','叫上朋友一起','先问有没有隐藏彩蛋']],['🎭','你最容易被哪种视频逗笑？',['高能整活','安静治愈','萌宠日常','完全无法解释的抽象视频']],['🧠','遇到棘手问题时，你会？',['立刻试几种方法','自己慢慢分析','找人讨论','先想个奇怪但可能有用的招']],['💬','群聊突然安静了，你会？',['主动开新话题','享受安静','发个可爱贴纸','发一句没人能接的怪话']],['🌧️','下雨天你更想？',['冲出去踩水','在家听雨','裹毯子喝热饮','给雨配一段史诗旁白']],['🎂','过生日最喜欢？',['热闹的大聚会','安静的小庆祝','收到用心的小礼物','意料之外的惊喜']],['🛒','逛超市时你会？',['迅速扫货','按清单慢慢买','看可爱包装','买一个完全没必要的东西']],['🪩','KTV里你是什么角色？',['麦霸','角落听众','给大家鼓掌','突然唱一首怪歌']],['👀','有人说你很特别，你觉得？',['当然，我独一无二','有点不好意思','希望是好意思','这还只是冰山一角']],['🎮','游戏里你更喜欢？',['冲锋带队','独自探索','养宠物装扮','测试奇怪的玩法']],['📷','拍合照时你会？',['站C位比耶','找个边边','做可爱手势','贡献最离谱的表情']],['🫧','压力大时你怎么放松？',['运动释放','一个人待会儿','找人贴贴聊天','刷梗笑到忘记压力']],['🌈','如果能有超能力，你选？',['瞬间移动','时间暂停','治愈别人','让所有人突然跳舞']],['🍰','朋友分你最后一口蛋糕，你会？',['大方接过','说你吃吧','开心得冒泡','发表获奖感言']],['🌙','凌晨突然有灵感，你会？',['马上行动','记下来明天做','分享给好朋友','越想越离谱']],['🐾','路上遇到可爱小动物？',['兴奋地打招呼','远远欣赏','心都化了','给它起一个怪名字']],['🧊','有人误解你，你会？',['直接解释','等合适时机再说','有点委屈','用幽默化解']],['🍟','聚餐最后一根薯条？',['问一圈然后吃掉','留给别人','掰成两半','宣布薯条继承权争夺战']],['📚','学习新东西时？',['边做边学','先看完整教程','找搭子一起','从最奇怪的问题开始']],['🎁','挑礼物你更看重？',['实用又惊喜','对方真正需要','可爱和心意','有梗且难忘']],['🧸','房间里最不能少？',['活动空间','舒服的角落','软萌小物','一个无用但好笑的摆件']],['🎢','面对未知挑战？',['好耶冲！','先观察一下','有人陪就行','这不就是新剧情吗']],['🥛','最后一题：你觉得自己是哪种奶？',['沸腾冒泡奶','冰镇慢热奶','甜甜软软奶','无法分类的神秘奶']]];
const vectors=[[5,0,1,2,4],[0,5,1,0,0],[1,2,5,0,4],[2,1,0,5,2]];let answers=[],index=0;
function show(id){['home','quiz','result'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));scrollTo(0,0)}function start(){answers=[];index=0;render();show('quiz')}function render(){count.textContent=`${index+1} / ${questions.length}`;fill.style.width=(index/questions.length*100)+'%';const q=questions[index];qemoji.textContent=q[0];question.textContent=q[1];options.innerHTML=q[2].map((s,i)=>`<button class="option" onclick="choose(${i})"><span>${'ABCD'[i]}.</span>${s}</button>`).join('')}function choose(i){answers[index]=i;index++;index>=questions.length?finish():(render(),scrollTo(0,0))}function previous(){if(index===0)show('home');else{index--;render()}}
function finish(){let totals=[0,0,0,0,0];answers.forEach((a,i)=>vectors[(a+i%4)%4].forEach((v,j)=>totals[j]+=v));let norm=totals.map(v=>v/questions.length);let scored=roles.map((r,i)=>({i,score:r[6].reduce((s,v,j)=>s+(v-norm[j])**2,0)})).sort((a,b)=>a.score-b.score);let r=roles[scored[0].i];temperature.textContent='🌡️ '+r[2]+'系奶门';rimage.src=r[1];rimage.alt=r[0];rname.textContent=r[0];tagline.textContent=r[3];description.textContent=r[4];buddy.textContent=r[5];chaos.textContent=Math.min(99,Math.max(30,Math.round(norm[3]*19+12)))+'%';show('result')}function restart(){start()}
function rounded(ctx,x,y,w,h,r,fill=true,stroke=false){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill)ctx.fill();if(stroke)ctx.stroke()}function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines=4){let line='',lines=[];for(const ch of text){let t=line+ch;if(ctx.measureText(t).width>maxWidth&&line){lines.push(line);line=ch}else line=t}if(line)lines.push(line);lines.slice(0,maxLines).forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight))}
async function saveCard(e){const btn=e.currentTarget;btn.disabled=true;btn.textContent='正在生成身份卡…';try{const c=document.createElement('canvas');c.width=1080;c.height=1440;const x=c.getContext('2d');let g=x.createLinearGradient(0,0,1080,1440);g.addColorStop(0,'#fff6bd');g.addColorStop(.55,'#fffdf7');g.addColorStop(1,'#ffe0d4');x.fillStyle=g;x.fillRect(0,0,1080,1440);x.textAlign='center';x.fillStyle='#291f1d';x.font='900 55px sans-serif';x.fillText('奶门身份鉴定局',540,92);x.fillStyle='#826b62';x.font='26px sans-serif';x.fillText('你的奶籍已经藏不住了',540,137);x.fillStyle='#fff';x.strokeStyle='#291f1d';x.lineWidth=8;rounded(x,65,185,950,1085,48,true,true);x.fillStyle='#ffdc4f';x.strokeStyle='#291f1d';x.lineWidth=5;rounded(x,350,225,380,70,35,true,true);x.fillStyle='#291f1d';x.font='900 29px sans-serif';x.fillText(temperature.textContent,540,270);const img=new Image();img.src=rimage.src;await img.decode();let sc=Math.min(560/img.width,475/img.height),w=img.width*sc,h=img.height*sc;x.drawImage(img,(1080-w)/2,315+(475-h)/2,w,h);x.fillStyle='#291f1d';x.font='900 86px sans-serif';x.fillText(rname.textContent,540,875);x.fillStyle='#745d55';x.font='700 34px sans-serif';x.fillText(tagline.textContent,540,927);x.fillStyle='#fff8dd';rounded(x,125,965,830,157,27,true,false);x.fillStyle='#453732';x.font='30px sans-serif';wrapText(x,description.textContent,540,1015,735,42,3);x.fillStyle='#f5e8ff';rounded(x,125,1150,395,83,23,true,false);x.fillStyle='#eaf6df';rounded(x,560,1150,395,83,23,true,false);x.fillStyle='#735d55';x.font='700 23px sans-serif';x.fillText('抽象浓度',322,1182);x.fillText('最佳奶搭子',758,1182);x.fillStyle='#291f1d';x.font='900 34px sans-serif';x.fillText(chaos.textContent,322,1218);x.fillText(buddy.textContent,758,1218);x.fillStyle='#291f1d';x.font='800 26px sans-serif';x.fillText('🥛 测测你是奶门里的谁',540,1342);x.fillStyle='#8b746c';x.font='22px sans-serif';x.fillText('纯娱乐趣味测试 · 奶籍仅供快乐参考',540,1382);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='我的奶门身份-'+rname.textContent+'.png';a.click()}finally{btn.disabled=false;btn.textContent='📸 保存奶门身份卡'}}
</script></body></html>
